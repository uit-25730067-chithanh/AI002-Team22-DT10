name: CI/CD Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'model/**', 'requirements.txt']
  pull_request:
    branches: [main]
    paths: ['backend/**', 'model/**', 'requirements.txt']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install -r requirements.txt
      - run: python3 -m pytest tests/ai-tests/ -q
      - run: pip install flake8 bandit
      - run: flake8 backend/ model/ --max-line-length=120
      - run: bandit -r backend/ -f json -o bandit-report.json || true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret is not configured. Backend tests passed; skipping optional Render deploy."
            exit 0
          fi

          http_status=$(curl --silent --show-error --output /tmp/render-deploy-response.txt --write-out "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL" || true)
          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            echo "Render deploy hook triggered successfully."
            exit 0
          fi

          echo "::warning::Render deploy hook returned HTTP $http_status. Backend tests passed; treating deploy as optional for source submission."
          exit 0
